{% extends "admin/login.html" %}
{% load static %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        body.login {
            background: linear-gradient(135deg, #1B4FA8 0%, #E8198A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #header {
            display: none;
        }
        #content {
            padding: 3rem !important;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            margin: 0;
        }
        .login-branding {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-branding h1 {
            font-family: 'Poppins', sans-serif;
            color: #1B4FA8;
            font-size: 1.5rem;
            margin: 0;
            font-weight: 700;
        }
        .login-branding p {
            font-family: 'Inter', sans-serif;
            color: #666;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }
        .submit-row {
            margin-top: 1.5rem;
            padding: 0 !important;
            border: none !important;
            background: transparent !important;
        }
        .submit-row input[type="submit"] {
            background: #E8198A !important;
            border-radius: 0.5rem !important;
            padding: 0.85rem !important;
            width: 100%;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            color: white !important;
            border: none !important;
        }
        .submit-row input[type="submit"]:hover {
            background: #d0157a !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(232,25,138,0.3);
        }
        .form-row {
            padding: 0.5rem 0 !important;
            border: none !important;
        }
        .form-row label {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            color: #333 !important;
            margin-bottom: 0.5rem;
            display: block;
        }
        .form-row input {
            border-radius: 0.5rem !important;
            border: 2px solid #e2e8f0 !important;
            padding: 0.85rem !important;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff !important;
            color: #1a202c !important;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-row input:focus {
            border-color: #1B4FA8 !important;
            outline: none;
        }
        /* Override Django dark mode completely for this card */
        @media (prefers-color-scheme: dark) {
            body.login { color: #333; }
        }
    </style>
{% endblock %}

{% block content %}
<div class="login-branding">
    <h1>📚 LCU Book Bank</h1>
    <p>Admin Dashboard Login</p>
</div>
{{ block.super }}
{% endblock %}
